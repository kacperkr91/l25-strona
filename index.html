<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L25 Premium Apartments – Kraków</title>
<meta name="description" content="L25 Premium Apartments, ul. Bolesława Limanowskiego 25, Kraków. Strona w przygotowaniu.">
<meta property="og:title" content="L25 Premium Apartments – Kraków, Podgórze">
<meta property="og:description" content="Siedem apartamentów na poddaszu kamienicy przy ul. Bolesława Limanowskiego 25 w Krakowie.">
<meta property="og:image" content="https://l25apartments.pl/img/og.jpg">
<link rel="icon" href="img/mark.png">
<link rel="preload" as="image" href="img/18-18-4.webp">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAFAF8;--ink:#232323;--muted:#4A4A46;--oak:#A2703F;--line:#D6D6D1;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 "Jost","Futura","Century Gothic",system-ui,sans-serif;display:grid;grid-template-rows:1fr auto;overflow-x:hidden}
main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);min-height:0}

/* left column */
.txt{display:flex;flex-direction:column;justify-content:center;gap:26px;padding:48px clamp(20px,6vw,88px)}
.txt > *{opacity:0;transform:translateY(18px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
.txt > :nth-child(1){animation-delay:.1s}
.txt > :nth-child(2){animation-delay:.35s}
.txt > :nth-child(3){animation-delay:.55s}
.txt > :nth-child(4){animation-delay:.7s}
.txt > :nth-child(5){animation-delay:.85s}
@keyframes rise{to{opacity:1;transform:none}}
.logo{width:120px;height:auto}
h1{font-weight:500;font-size:clamp(30px,3.6vw,48px);line-height:1.1;letter-spacing:-.02em;margin:0;text-wrap:balance}
p{margin:0;color:var(--muted);max-width:42ch}
.en{font-size:15px}
.c{display:flex;flex-wrap:wrap;gap:10px 26px;border-top:1px solid var(--line);padding-top:20px}
.c a{color:var(--ink);text-decoration:none;font-weight:500;font-size:17px;background:linear-gradient(var(--oak),var(--oak)) 0 100%/0 1px no-repeat;transition:background-size .35s,color .2s}
.c a:hover,.c a:focus-visible{color:var(--oak);background-size:100% 1px}
:focus-visible{outline:2px solid var(--oak);outline-offset:4px}

/* slideshow */
.show{position:relative;overflow:hidden;background:#ddd}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease}
.slide.on{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 7.5s linear}
.slide.on img{transform:scale(1)}
.cap{position:absolute;left:24px;bottom:24px;z-index:2;display:flex;align-items:center;gap:16px;background:var(--paper);padding:10px 16px 10px 14px}
.cap b{font-weight:500;font-size:15px;min-width:9ch}
.dots{display:flex;gap:6px}
.dots button{width:26px;height:3px;border:0;padding:0;background:var(--line);cursor:pointer;position:relative;overflow:hidden}
.dots button span{position:absolute;inset:0;background:var(--ink);transform:scaleX(0);transform-origin:left}
.dots button.done span{transform:scaleX(1)}
.dots button.on span{animation:fill var(--dur) linear forwards}
@keyframes fill{to{transform:scaleX(1)}}

/* moving checker band */
.checker{height:22px;background:conic-gradient(var(--ink) 25%,var(--paper) 0 50%,var(--ink) 0 75%,var(--paper) 0) 0 0/22px 22px;animation:slide 14s linear infinite}
@keyframes slide{to{background-position:220px 0}}

@media (max-width:820px){main{grid-template-columns:1fr}.show{order:-1;height:48vh}.cap{left:12px;bottom:12px}}
@media (prefers-reduced-motion:reduce){
  .txt > *{animation:none;opacity:1;transform:none}
  .slide,.slide img{transition:none}.slide img{transform:none}
  .checker{animation:none}.dots button.on span{animation:none;transform:scaleX(1)}
}
</style>
</head>
<body>
<main>
  <div class="txt">
    <img class="logo" src="img/logo.png" alt="L25 Premium Apartments" width="120" height="141">
    <h1>Nowa strona jest w przygotowaniu</h1>
    <p>Siedem apartamentów na poddaszu kamienicy przy ul. Bolesława Limanowskiego 25 w krakowskim Podgórzu.</p>
    <p class="en">Seven attic apartments in a Podgórze tenement, Kraków. Our new website is on its way.</p>
    <div class="c">
      <a href="tel:+48888488519">+48 888 488 519</a>
      <a href="https://wa.me/48888488519" rel="noopener">WhatsApp</a>
      <a href="mailto:rezerwacje@l25apartments.pl">rezerwacje@l25apartments.pl</a>
    </div>
  </div>
  <div class="show" id="show" aria-roledescription="pokaz zdjęć">
    <div class="cap"><b id="capT">Nr 18</b><div class="dots" id="dots" role="tablist" aria-label="Zdjęcia"></div></div>
  </div>
</main>
<div class="checker" aria-hidden="true"></div>

<script>
const SLIDES = [
  ["18-18-4", "Nr 18"],
  ["23-23-2", "Nr 23"],
  ["wspolne-wspolne-4-s", "Klatka schodowa"],
  ["19-19-5", "Nr 19"],
  ["24-19-8", "Nr 24"],
  ["21-19-4", "Nr 21"],
  ["wspolne-wspolne-13", "Rynek Podgórski"],
  ["22-22-2", "Nr 22"]
];
const DUR = 6000;
const show = document.getElementById("show"), dots = document.getElementById("dots"), capT = document.getElementById("capT");
document.documentElement.style.setProperty("--dur", DUR + "ms");
SLIDES.forEach(([f, t], i) => {
  const d = document.createElement("div");
  d.className = "slide" + (i === 0 ? " on" : "");
  d.innerHTML = `<img src="img/${f}.webp" alt="${t}" ${i ? 'loading="lazy"' : ""}>`;
  show.insertBefore(d, show.querySelector(".cap"));
  const b = document.createElement("button");
  b.type = "button"; b.setAttribute("aria-label", t); b.innerHTML = "<span></span>";
  b.onclick = () => go(i, true);
  dots.appendChild(b);
});
const slides = [...show.querySelectorAll(".slide")], btns = [...dots.children];
let cur = 0, timer;
function paint(){
  slides.forEach((s, k) => s.classList.toggle("on", k === cur));
  btns.forEach((b, k) => { b.classList.remove("on"); b.classList.toggle("done", k < cur); });
  void btns[cur].offsetWidth; btns[cur].classList.add("on");
  capT.textContent = SLIDES[cur][1];
  const nx = slides[(cur + 1) % slides.length].querySelector("img"); nx.loading = "eager";
}
function go(i, manual){
  cur = (i + slides.length) % slides.length; paint();
  clearTimeout(timer); timer = setTimeout(() => go(cur + 1), DUR);
}
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) { paint(); timer = setTimeout(() => go(1), DUR); }
else paint();
document.addEventListener("visibilitychange", () => { if (document.hidden) clearTimeout(timer); else go(cur); });
</script>
</body>
</html>
